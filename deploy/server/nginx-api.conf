# Include inside the existing `server { server_name gdgostimtech.com; ... }` block.
# The API listens on loopback only; nginx is the single public entry point.
location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (never append) so clients cannot spoof their address for rate limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6m;
}

# Admin panel: prerendered shell + its JS bundle. Never cache the HTML.
location = /admin { return 301 /admin/; }
location /admin/ {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/index.html =404;
}
