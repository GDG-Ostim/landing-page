name: Validate monorepo

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate web and API
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: API integration tests
        run: bun run test

      - name: Build web and API
        env:
          STATIC_EXPORT: "1"
        run: bun run build

      - name: Package tests
        run: bun run --cwd app test:packages
